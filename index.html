<!doctype html>

<!-- setting up the language -->
<html lang="en">
  <head>
    <!-- adapting scaling of text and displays for the phone -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chicago Business Mix by Community Area</title>

    <!-- Leaflet's map styles (Week 3) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <!-- linking the font used in style.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;700&display=swap">

    <!-- my own styles -->
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
    <!-- title and description of the project to explain what this is -->
    <header>
      <h1>Chicago Business Mix</h1>
    </header>

    <!-- adding the main side panel for the dashboard -->
    <main>
      <aside class="controls">
        <!-- working on the section that is controls.js the side panel-->
         <section class = "section" aria-labelledby="explore-title">
        <h2 id="explore-title" class="section-title">Explore</h2>
        </section>

         <!--from week 6, titled group with an empty list that controls.js fills in - from week 6-->
        <fieldset id="categories">
          <legend>Type of Business</legend>
          <ul id="category-list"></ul>
        </fieldset>

       
      <!--empty paragraph for controls.js to wroite into with an empty list, from week 8 stuff-->
      <p id="category-help" class="help-text" </p>
      
        <!--search box and empty list-->
      
        <fieldset id="areas">
          <legend>Community Areas</legend>
          <input class="search" name="search-areas" aria-label="Search for a community area" placeholder="Search for a community area...">
          <ul id="area-list" class="area-list"></ul>
        </fieldset>
        </section>
      

      </aside>

      <!-- map container -->
      <div
        id="map"
        role="region"
        aria-roledescription="map"
        aria-label="Map of Chicago community areas by business concentration"
        aria-details="map-legend"
      ></div>
    </main>

    <!-- load the map tool (Leaflet) first, then my own code (Week 3/6) -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
